# Publishes site/ to GitHub Pages on every push to main that touches site/ (or
# this file), and on demand from the Actions tab. Requires Settings > Pages >
# Source: "GitHub Actions". Until Pages is enabled the run warns and skips the
# deploy instead of failing; once it is, run this workflow from the Actions tab.
# The site assumes https://maiiasleptcova.github.io/collivind/ (canonical URLs,
# Open Graph, sitemap, 404 home link): grep for it if the address changes.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Skip only on an explicit 404 (Pages not enabled); any other API error
      # falls through to the deploy so it fails loudly.
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>&1 || true)
          if grep -q '"status": *"404"' <<<"$out"; then
            echo "::warning::GitHub Pages is not enabled for this repository; skipping the deploy."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pages.outputs.enabled
        uses: actions/checkout@v7
      - if: steps.pages.outputs.enabled
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - if: steps.pages.outputs.enabled
        id: deployment
        uses: actions/deploy-pages@v5
